global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Métricas del sistema (CPU, RAM, disco, red).
  # Para más servidores: instala node_exporter en cada uno y agrégalo aquí.
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          env: lab

  # Disponibilidad HTTP y vencimiento de certificados SSL.
  - job_name: blackbox_http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://github.com
          - https://www.google.com
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

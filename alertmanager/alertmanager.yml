# Ejemplo con correo SMTP. Reemplaza los valores con los tuyos
# (para Gmail usa una "contraseña de aplicación", no tu clave normal).
global:
  smtp_smarthost: "smtp.example.com:587"
  smtp_from: "alertas@example.com"
  smtp_auth_username: "alertas@example.com"
  smtp_auth_password: "CAMBIAR"
  smtp_require_tls: true

route:
  receiver: correo
  group_by: [alertname, instance]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: correo
    email_configs:
      - to: "tu-correo@example.com"
        send_resolved: true

inhibit_rules:
  - source_matchers: [severity="critical"]
    target_matchers: [severity="warning"]
    equal: [instance]
